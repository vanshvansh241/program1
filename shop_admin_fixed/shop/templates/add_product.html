{% extends "base.html" %}
{% block title %}Add Product | GalaxyStore{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container">
        <p class="tag">ADMIN</p>
        <h1>Add New Product</h1>
    </div>
</section>
<section class="form-section">
    <form class="admin-form" method="POST">
        <label>Product Name</label>
        <input name="name" required placeholder="e.g. School Blazer">
        <label>Category</label>
        <select name="category">
            <option>Stationery</option>
            <option>School Dress</option>
        </select>
        <label>Price (₹)</label>
        <input type="number" name="price" min="0" step="1" required>
        <label>Stock Quantity</label>
        <input type="number" name="stock" min="0" required>
        <label>Description</label>
        <textarea name="description" rows="4" placeholder="Product description"></textarea>
        <button class="btn primary" type="submit">Add Product</button>
    </form>
</section>
{% endblock %}
