{% extends "base.html" %}

{% block title %}Admin Login | CampusStore{% endblock %}

{% block content %}

<section class="login-section">
    <div class="login-box">

        <div class="login-icon">🔐</div>

        <p class="tag">ADMIN PANEL</p>
        <h1>Admin Login</h1>
        <p class="login-subtitle">
            Login to manage products and stock.
        </p>

        <form method="POST">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" class="btn primary full">
                Login
            </button>

        </form>

    </div>
</section>

{% endblock %}
